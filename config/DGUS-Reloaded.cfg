# DGUS-Reloaded Required Helper Macros & Variables for Klipper

[save_variables]
filename: /home/pi/klipper/klippy/extras/t5uid1/dgus_reloaded/variables.cfg

####################################
# PAUSE_STOP control macros
[gcode_macro SET_DISABLE_PAUSE_STOP]
description: Saves a control variable tested by dgus_reloaded vars_in.cfg before processing PAUSE and STOP commands
gcode: 
    {% set svv = printer.save_variables.variables %}
    SAVE_VARIABLE VARIABLE=disable_pause_stop VALUE=True
    M117 PAUSE and STOP suspended

[gcode_macro CLEAR_DISABLE_PAUSE_STOP]
description: Saves a control variable tested by dgus_reloaded vars_in.cfg before processing PAUSE and STOP commands
gcode: 
    {% set svv = printer.save_variables.variables %}
    SAVE_VARIABLE VARIABLE=disable_pause_stop VALUE=False
    M117 PAUSE and STOP restored

###################################
# Countdown Timer control macros
[gcode_macro START_COUNTDOWN_TIMER]
description: Saves a control variable tested by dgus_reloaded vars_out.cfg before updating the Estimated Print Time Remaining parameter
gcode: 
    {% set svv = printer.save_variables.variables %}
    SAVE_VARIABLE VARIABLE=start_countdown_timer VALUE=True

[gcode_macro STOP_COUNTDOWN_TIMER]
description: Saves a control variable tested by dgus_reloaded vars_out.cfg before updating the Estimated Print Time Remaining parameter
gcode: 
    {% set svv = printer.save_variables.variables %}
    SAVE_VARIABLE VARIABLE=start_countdown_timer VALUE=False

################################################
# Filament RunOut Sensor control Macros
[gcode_macro REPORT_FILAMENT_SENSOR_ENABLE_STATUS]
description: Reports whether the filament sensor is enabled (safe)
gcode:
    {% set ns = namespace(sensor=None, sensor_name=None) %}

    {% for name in printer %}
        {% if name.startswith("filament_motion_sensor ") or name.startswith("filament_switch_sensor ") %}
            {% if ns.sensor is none %}
                {% set ns.sensor = printer[name] %}
                {% set ns.sensor_name = name.split(" ", 1)[1] %}
            {% endif %}
        {% endif %}
    {% endfor %}
    
    {% if ns.sensor is none %}
        M118 No filament sensor found
    {% else %}
        M118 Using sensor: {ns.sensor_name}
    {% endif %}

    {% if ns.sensor is not none %}
        {% if ns.sensor.enabled %}
            M118 Runout Sensor ENABLED
            M117 Runout Sensor ENABLED
        {% else %}
            M118 Runout Sensor DISABLED
            M117 Runout Sensor DISABLED
        {% endif %}
    {% else %}
        M118 No filament sensor installed
    {% endif %}

[gcode_macro RUNOUT_OFF]
description: Disables the filament runout sensor (safe, sensor-agnostic)
gcode:
    {% set ns = namespace(sensor=None, sensor_name=None) %}

    {% for name in printer %}
        {% if name.startswith("filament_motion_sensor ") or name.startswith("filament_switch_sensor ") %}
            {% if ns.sensor is none %}
                {% set ns.sensor = printer[name] %}
                {% set ns.sensor_name = name.split(" ", 1)[1] %}
            {% endif %}
        {% endif %}
    {% endfor %}
    
    {% if ns.sensor is none %}
        M118 No filament sensor found
    {% else %}
        M118 Using sensor: {ns.sensor_name}
    {% endif %}

    {% if ns.sensor is not none %}
        SET_FILAMENT_SENSOR SENSOR={ns.sensor_name} ENABLE=0
        SAVE_VARIABLE VARIABLE=enable_runout_sensor VALUE=0
        REPORT_FILAMENT_SENSOR_ENABLE_STATUS
    {% else %}
        SAVE_VARIABLE VARIABLE=enable_runout_sensor VALUE=0
    {% endif %}

[gcode_macro RUNOUT_ON]
description: Enables the filament runout sensor (safe, sensor-agnostic)
gcode:
    {% set ns = namespace(sensor=None, sensor_name=None) %}

    {% for name in printer %}
        {% if name.startswith("filament_motion_sensor ") or name.startswith("filament_switch_sensor ") %}
            {% if ns.sensor is none %}
                {% set ns.sensor = printer[name] %}
                {% set ns.sensor_name = name.split(" ", 1)[1] %}
            {% endif %}
        {% endif %}
    {% endfor %}
    
    {% if ns.sensor is none %}
        M118 No filament sensor found
    {% else %}
        M118 Using sensor: {ns.sensor_name}
    {% endif %}

    {% if ns.sensor is not none %}
        SET_FILAMENT_SENSOR SENSOR={ns.sensor_name} ENABLE=1
        SAVE_VARIABLE VARIABLE=enable_runout_sensor VALUE=1
        REPORT_FILAMENT_SENSOR_ENABLE_STATUS
    {% else %}
        SAVE_VARIABLE VARIABLE=enable_runout_sensor VALUE=0
    {% endif %}

[gcode_macro APPLY_RUNOUT_STATE]
description: Restores the saved runout sensor state (sensor-agnostic)
gcode:
    {% set ns = namespace(sensor=None, sensor_name=None) %}

    {% for name in printer %}
        {% if name.startswith("filament_motion_sensor ") or name.startswith("filament_switch_sensor ") %}
            {% if ns.sensor is none %}
                {% set ns.sensor = printer[name] %}
                {% set ns.sensor_name = name.split(" ", 1)[1] %}
            {% endif %}
        {% endif %}
    {% endfor %}

    {% if ns.sensor is not none %}
        {% set svv = printer.save_variables.variables %}
        {% if svv.enable_runout_sensor|default(0)|int == 1 %}
            SET_FILAMENT_SENSOR SENSOR={ns.sensor_name} ENABLE=1
        {% else %}
            SET_FILAMENT_SENSOR SENSOR={ns.sensor_name} ENABLE=0
        {% endif %}
    {% else %}
        SAVE_VARIABLE VARIABLE=enable_runout_sensor VALUE=0
    {% endif %}

################################################
# Filament LOAD/UNLOAD movement macro
[gcode_macro DGUS_FILAMENT_MOVE]
gcode:
  {% set ext_name = params.EXTRUDER %}
  {% set length = params.LENGTH | float %}
  {% set direction = params.DIRECTION %}
  {% set fw_min_temp = printer.configfile.settings[ext_name].min_extrude_temp|int %}
  {% if 'save_variables' in printer %}
    {% set svv = printer.save_variables.variables %}
  {% else %}
    {% set svv = {} %}
  {% endif %}
  {% set current_filament_type = svv.current_filament_type|default(0)|int %}
  {% if current_filament_type == 1 %}
    {% set min_temp = svv.filament_type_1_min_extrude_temp|default(0)|int %}
  {% elif current_filament_type == 2 %}
    {% set min_temp =  svv.filament_type_2_min_extrude_temp|default(0)|int %}
  {% elif current_filament_type == 3 %}
    {% set min_temp =  svv.filament_type_3_min_extrude_temp|default(0)|int %}
  {% else %}
    {% set min_temp = fw_min_temp %}
  {% endif %}
  {% if printer[ext_name].temperature < min_temp %}
    {% set msg1 = "Nozzle: %dC < %dC" % (printer[ext_name].temperature|int, min_temp|int) %}
    {% set msg2 = "Nozzle too cold: %dC < %dC minimum" % (printer[ext_name].temperature|int, min_temp|int) %}
    DGUS_SET_MESSAGE MSG="{msg1}"
    RESPOND TYPE=error MSG="{msg2}"
    M300 S880 P255
  {% elif printer[ext_name].target < min_temp %}
    {% set msg1 = "Heater target %dC < %dC" % (printer[ext_name].target|int, min_temp|int) %}
    {% set msg2 = "Heater target %dC < %dC minimum - heat nozzle first" % (printer[ext_name].target|int, min_temp|int) %}
    DGUS_SET_MESSAGE MSG="{msg1}"
    RESPOND TYPE=error MSG="{msg2}"
    M300 S880 P255
  {% else %}
    SAVE_GCODE_STATE NAME=state_filament_move
    ACTIVATE_EXTRUDER EXTRUDER={ext_name}
    M83
    {% if direction == "retract" %}
      G1 E5 F300
      G1 E-{length} F1800
    {% elif direction == "extrude" %}
      G1 E{length} F400
    {% endif %}
    RESTORE_GCODE_STATE NAME=state_filament_move
    M300 S255 P50
  {% endif %}

################################################
# WAIT STATE & Screen Sync Macros
[gcode_macro WAIT_STATE]
variable_active: 2
gcode:
    # Initialized to '2', to prevent wait_return routine from returning to calling screen before WAIT_ON

[gcode_macro RESET_WAIT_STATE]
gcode:
    SET_GCODE_VARIABLE MACRO=WAIT_STATE VARIABLE=active VALUE=2
    
[gcode_macro WAIT_ON]
gcode:
    SET_GCODE_VARIABLE MACRO=WAIT_STATE VARIABLE=active VALUE=1

[gcode_macro WAIT_OFF]
gcode:
    SET_GCODE_VARIABLE MACRO=WAIT_STATE VARIABLE=active VALUE=0

[gcode_macro HOME_WITH_WAIT]
gcode:
    WAIT_ON
    G28
    M400
    WAIT_OFF

[gcode_macro HOME_WITH_WAIT_XY]
gcode:
    WAIT_ON
    G28 X Y
    M400
    WAIT_OFF

[gcode_macro HOME_WITH_WAIT_Z]
gcode:
    WAIT_ON
    G28 Z
    M400
    WAIT_OFF

[gcode_macro WAIT_FOR_PID]
description: Run PID calibration with WAIT_STATE synchronization
gcode:
    SET_GCODE_VARIABLE MACRO=WAIT_STATE VARIABLE=active VALUE=1
    {% if params.HEATER|lower == "bed" %}
        PID_CALIBRATE HEATER=heater_bed TARGET={params.TARGET}
    {% else %}
        PID_CALIBRATE HEATER=extruder TARGET={params.TARGET}
    {% endif %}
    {% if params.HEATER|lower == "bed" %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=0 MAXIMUM=999
    {% else %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM=0 MAXIMUM=999
    {% endif %}
    SET_GCODE_VARIABLE MACRO=WAIT_STATE VARIABLE=active VALUE=0

[gcode_macro STOP_PRINT]
gcode:
    CLEAR_PAUSE
    DGUS_PRINT_END
    CANCEL_PRINT
    UPDATE_DELAYED_GCODE ID=reset_after_cancel DURATION=0.1

[gcode_macro _RESET_AFTER_CANCEL]
description: Resets velocity and acceleration limits after cancel
gcode:
    M400
    {% set max_v = printer.configfile.settings.printer.max_velocity %}
    {% set max_a = printer.configfile.settings.printer.max_accel %}
    SET_VELOCITY_LIMIT VELOCITY={max_v} ACCEL={max_a}

[delayed_gcode reset_after_cancel]
gcode:
    _RESET_AFTER_CANCEL
