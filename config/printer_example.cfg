[include fluidd.cfg]
[include mainsail.cfg]
[include macro.cfg]
[include DGUS-Reloaded.cfg]
[stepper_x]
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 64
rotation_distance: 64
endstop_pin: ^PA5
position_endstop: 0
position_max: 250
homing_speed: 50

[stepper_y]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PC3
microsteps: 64
rotation_distance: 64
endstop_pin: ^PA6
position_endstop: 250
position_max: 250
homing_speed: 50

[stepper_z]
step_pin: PB6
dir_pin: PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
#position_endstop: 0.0                     
#endstop_pin: ^PA7    
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 285

[bltouch]
sensor_pin: ^PB1
control_pin: PB0
pin_up_touch_mode_reports_triggered: False
probe_with_touch_mode: True
#pin_up_reports_not_triggered: true
#x_offset: -48
x_offset: -10
y_offset: 5
#z_offset: 2.0
##x_offset: 33
##y_offset: 28
##z_offset: 0 # Must be 0 or conflicts with `#*# z_offset` in the auto-generated section at the bottom of this file. See https://www.youtube.com/watch?v=vduYl9Rw5iI
stow_on_each_sample: False

[bed_mesh]
speed: 300
horizontal_move_z: 5
mesh_min: 10, 5
mesh_max: 200, 230
probe_count: 5, 5
#fade_start: 1
#fade_end: 10
#fade_target: 0


[extruder]
max_extrude_only_distance: 200.0
step_pin: PB4
dir_pin: !PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 22.400
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
#control: pid
#pid_Kp: 26.949
#pid_Ki: 1.497
#pid_Kd: 121.269
min_temp: 0
max_temp: 260
pressure_advance: 0.7


[heater_bed]
heater_pin: PA15
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_Kp: 327.11
#pid_Ki: 19.20
#pid_Kd: 1393.45
min_temp: 0
max_temp: 100

[safe_z_home]
#home_xy_position: 1,1
home_xy_position: 125,125
speed: 140
z_hop: 10
z_hop_speed: 5

[fan]
pin: PA0

[filament_switch_sensor e0_sensor]
switch_pin: !PA4

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

[printer]
kinematics: corexy
max_velocity:250
max_accel: 3500
max_z_velocity: 10
max_z_accel: 100

[gcode_macro START_PRINT]
#BED_MESH_PROFILE LOAD=default
#default_parameter_BED_TEMP: 70 
#default_parameter_EXTRUDER_TEMP: 230
gcode:
        
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
    # Start bed heating
    M140 S{BED_TEMP}
    # Use absolute coordinates
    G90
    # Reset the G-Code Z offset (adjust Z offset if needed)
    SET_GCODE_OFFSET Z=0.0
    # Home the printer
    G28
    # Move the nozzle near the bed
    G1 Z5 F3000
    # Move the nozzle very close to the bed
    G1 Z0.15 F300
    # Wait for bed to reach temperature
    M190 S{BED_TEMP}
    # Set and wait for nozzle to reach temperature
    M109 S{EXTRUDER_TEMP}
    G92 E0 ; Reset Extruder
    G1 Z2.0 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed
    G1 X0.1 Y20 Z0.3 F5000.0 ; Move to start position
    G1 X0.1 Y200.0 Z0.3 F1500.0 E15 ; Draw the first line
    G1 X0.4 Y200.0 Z0.3 F5000.0 ; Move to side a little
    G1 X0.4 Y20 Z0.3 F1500.0 E30 ; Draw the second line
    G1 X0.9 Y200.0 Z0.3 F5000.0 ; Move to side a little
    G1 X0.9 Y20 Z0.3 F1500.0 E30 ; Draw the third line
    G92 E0 ; Reset Extruder
 
[gcode_macro END_PRINT]
gcode:
  # Turn off bed, extruder, and fan
    M140 S0
    M104 S0
    M106 S0
    # Raise nozzle by 10mm
    G1 Z100 F3000
    G1 X0.1 Y20 Z100.3 F5000.0 ; Move to start position
    # Move nozzle away from print while retracting
    #G91
    #G90
    # Disable steppers
    M84


